[package]
edition.workspace = true
license.workspace = true
name = "codex-team"
version.workspace = true

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true, features = ["json", "ws", "http1", "tokio"] }
clap = { workspace = true, features = ["derive"] }
codex-app-server-client = { workspace = true }
codex-app-server-protocol = { workspace = true }
codex-http-client = { workspace = true }
codex-state = { workspace = true }
codex-team-store = { workspace = true }
codex-uds = { workspace = true }
codex-utils-absolute-path = { workspace = true }
codex-utils-rustls-provider = { workspace = true }
futures = { workspace = true }
hmac = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "io-std", "net", "process", "rt", "signal", "sync", "time"] }
tokio-tungstenite = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["v4", "v5", "v7"] }

[dev-dependencies]
app_test_support = { path = "../app-server/tests/common" }
codex-utils-cargo-bin = { workspace = true }
wiremock = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
